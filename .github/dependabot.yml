# Actualizaciones automáticas. Agrupadas por paquete para que llegue un PR
# por semana y carpeta, no uno por dependencia. Las de seguridad no esperan
# al lunes: Dependabot las abre apenas sale el aviso.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # vitest y @vitest/coverage-v8 se piden la misma versión exacta como
      # peer: separados, cada PR rompe `npm ci` por sí solo.
      vitest:
        patterns: ['vitest', '@vitest/*']
      api-menores:
        update-types: [minor, patch]
    commit-message: { prefix: 'chore(api)' }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-menores:
        update-types: [minor, patch]
    # Mayores bloqueadas por eslint-config-next: su eslint-plugin-react no
    # carga en ESLint 10 y typescript-eslint no soporta TS 7. Sacar cada
    # regla cuando Next publique un config compatible.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message: { prefix: 'chore(web)' }

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    groups:
      e2e:
        patterns: ['*']
    commit-message: { prefix: 'chore(e2e)' }

  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: 'chore(docker)' }

  # Mantiene al día los SHA fijados en los workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
    commit-message: { prefix: 'ci' }
