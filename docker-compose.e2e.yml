# Override para los E2E de Playwright (paquete e2e/). Suma un OpenRouter falso
# y determinista, un Mercado Pago falso (OAuth, links de pago, suscripciones y
# webhooks firmados), una tienda y un Mercado Libre falsos para la importación
# rápida, y le prende a la API el login de desarrollo:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d
#   cd e2e && npm run e2e
#
# `environment` pisa lo que venga de api/.env, así que ni la clave real de
# OpenRouter ni las credenciales reales de Mercado Pago se usan mientras este
# override esté activo.
services:
  openrouter-stub:
    image: node:26.12.1-alpine
    working_dir: /stub
    command: ["node", "server.mjs"]
    volumes:
      - ./e2e/openrouter-stub:/stub:ro
    ports:
      - "4010:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  mercadopago-stub:
    image: node:26.12.1-alpine
    working_dir: /stub
    command: ["node", "server.mjs"]
    environment:
      PORT: "4020"
      # El navegador llega por localhost (pantallas de autorización y de pago);
      # la API, por el nombre del servicio. El webhook sale hacia la API por la
      # red de compose aunque el notification_url diga localhost.
      URL_PUBLICA: http://localhost:4020
      API_INTERNA: http://api:4000
      SECRETO_WEBHOOK: e2e-webhook-secret
    volumes:
      - ./e2e/mercadopago-stub:/stub:ro
    ports:
      - "4020:4020"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4020/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  importacion-stub:
    image: node:26.12.1-alpine
    working_dir: /stub
    command: ["node", "server.mjs"]
    environment:
      PORT: "4030"
    volumes:
      - ./e2e/importacion-stub:/stub:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4030/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    # El stack de e2e corre con su propio nombre de proyecto (ver e2e/package.json),
    # así que arranca con una base vacía: las migraciones van antes de levantar.
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npm run start:dev"]
    environment:
      OPENROUTER_BASE_URL: http://openrouter-stub:4010/api/v1
      OPENROUTER_API_KEY: e2e
      OPENROUTER_MODEL: stub/conversacion
      # Las sugerencias de ventas (Jev) van a la Decisions API, que no cuelga de /api/v1.
      OPENROUTER_DECISIONS_URL: http://openrouter-stub:4010/api/alpha/decisions
      DEV_LOGIN_PASSWORD: e2e-password
      # Secreto fijo sólo para este stack: permite a los specs de e2e firmar un
      # webhook de Mercado Pago válido sin conocer (ni imprimir) el secreto real.
      MERCADOPAGO_WEBHOOK_SECRET: e2e-webhook-secret
      # OAuth y links de pago de los comercios contra el Mercado Pago falso: la
      # API lo llama por la red de compose, y al navegador se lo manda a localhost.
      MERCADOPAGO_BASE_URL: http://mercadopago-stub:4020
      MERCADOPAGO_AUTH_URL: http://localhost:4020
      MERCADOPAGO_CLIENT_ID: e2e-app
      MERCADOPAGO_CLIENT_SECRET: e2e-secret
      # La suscripción de Trato (preapproval) también va al Mercado Pago falso:
      # así un spec puede pasar una cuenta al plan Pro de verdad.
      MERCADOPAGO_ACCESS_TOKEN: e2e-access-token
      # Importación rápida: la tienda y el Mercado Libre falsos. Este host es
      # el único al que la importación puede pedir por http y en la red
      # interna; validateEnv no deja arrancar con esto en producción.
      MERCADOLIBRE_API_URL: http://importacion-stub:4030/ml
      MERCADOLIBRE_CLIENT_ID: e2e-ml-app
      MERCADOLIBRE_CLIENT_SECRET: e2e-ml-secret
      IMPORTACION_HOSTS_DE_PRUEBA: importacion-stub
    depends_on:
      openrouter-stub:
        condition: service_healthy
      mercadopago-stub:
        condition: service_healthy
      importacion-stub:
        condition: service_healthy
